name: Build LFS arm64

# Simpan di repo publik sebagai: .github/workflows/build.yml
# Jalankan manual: tab Actions -> Build LFS arm64 -> Run workflow.
# Tahap dijalankan berurutan: toolchain -> chroot -> system -> config -> image.
# Tiap tahap memakai checkpoint tahap sebelumnya (disimpan lewat cache).
# Skrip tiap tahap ada di repo: scripts/stage-<nama>.sh (kecuali tahap image).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Tahap yang dijalankan"
        type: choice
        options: [toolchain, chroot, system, config, image]
        default: toolchain
      image_size:
        description: "Ukuran lfs.img (hanya tahap image), contoh 6G"
        default: "6G"
      tag:
        description: "Nama Release untuk hasil (hanya tahap image)"
        default: "lfs-v1"

permissions:
  contents: write

concurrency:
  group: lfs-build
  cancel-in-progress: false

env:
  WORK: /home/runner/lfs-work
  LFS: /mnt/lfs

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    env:
      STAGE: ${{ inputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek mesin
        run: |
          uname -m
          nproc
          free -h
          df -h

      - name: Pasang paket host
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison gawk texinfo m4 patch \
            python3 xz-utils wget curl zstd e2fsprogs

      - name: Siapkan variabel
        run: |
          echo "LFS_TGT=$(uname -m)-lfs-linux-gnu" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

      - name: Pulihkan checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}
          key: lfs-ckpt-${{ github.run_id }}
          restore-keys: lfs-ckpt-

      - name: Siapkan LFS dari checkpoint sebelumnya
        run: |
          mkdir -p "$WORK"
          case "$STAGE" in
            toolchain) PREV="" ;;
            chroot)    PREV=toolchain ;;
            system)    PREV=chroot ;;
            config)    PREV=system ;;
            image)     PREV=config ;;
          esac
          sudo mkdir -p "$LFS"
          if [ -n "$PREV" ]; then
            if [ ! -f "$WORK/$PREV.tar.zst" ]; then
              echo "Checkpoint $PREV tidak ditemukan. Jalankan tahap $PREV dulu."
              exit 1
            fi
            sudo tar -I zstd -xpf "$WORK/$PREV.tar.zst" -C "$LFS"
          fi
          df -h "$LFS"

      - name: Jalankan tahap
        if: ${{ inputs.stage != 'image' }}
        run: |
          SCRIPT="scripts/stage-$STAGE.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "File $SCRIPT belum ada di repo."
            exit 1
          fi
          sudo -E bash "$SCRIPT"

      - name: Lepas mount virtual (supaya tidak ikut checkpoint)
        if: ${{ always() && inputs.stage != 'image' }}
        run: |
          for m in dev/pts dev proc sys run; do
            sudo umount -R "$LFS/$m" 2>/dev/null || true
          done

      - name: Simpan checkpoint
        if: ${{ success() && inputs.stage != 'image' }}
        run: |
          sudo tar --one-file-system -I 'zstd -T0 -3' -cpf "$WORK/$STAGE.tar.zst" -C "$LFS" .
          sudo chown "$(id -u):$(id -g)" "$WORK/$STAGE.tar.zst"
          ls -lh "$WORK"

      - name: Simpan cache checkpoint
        if: ${{ success() && inputs.stage != 'image' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}
          key: lfs-ckpt-${{ github.run_id }}

      - name: Kemas image dan unggah ke Release
        if: ${{ inputs.stage == 'image' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SIZE: ${{ inputs.image_size }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$HOME"
          # Ukuran image harus lebih besar dari isi $LFS, kalau tidak mke2fs gagal.
          truncate -s "$IMAGE_SIZE" lfs.img
          sudo mke2fs -q -t ext4 -d "$LFS" lfs.img
          sudo rm -rf "$LFS"
          zstd -T0 -10 -f lfs.img -o lfs.img.zst
          rm -f lfs.img
          ls -lh lfs.img.zst
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Image LFS arm64 untuk UML"
          SIZE=$(stat -c %s lfs.img.zst)
          if [ "$SIZE" -gt 2000000000 ]; then
            split -b 1900M -d lfs.img.zst lfs.img.zst.part-
            rm lfs.img.zst
            gh release upload "$TAG" lfs.img.zst.part-* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$TAG" lfs.img.zst --clobber --repo "$GITHUB_REPOSITORY"
          fi
